<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام متابعة الإنتاج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
        * {
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #f8fafc;
            color: #0f172a;
        }
        .modal-overlay {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
        }
        .stage-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stage-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.15);
        }
        .summary-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            position: relative;
            overflow: hidden;
        }
        .summary-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 10px 10px -5px rgba(15, 23, 42, 0.04);
            border-color: #cbd5e1;
        }
        .border-blue { border-top: 5px solid #2563eb; }
        .border-indigo { border-top: 5px solid #4f46e5; }
        .border-emerald { border-top: 5px solid #059669; }
        .border-purple { border-top: 5px solid #7c3aed; }
        .border-orange { border-top: 5px solid #ea580c; }
        .border-red { border-top: 5px solid #dc2626; }
        .border-stone { border-top: 5px solid #475569; }
        .border-amber { border-top: 5px solid #d97706; }

        .summary-card .card-title {
            font-weight: 800;
            color: #1e293b;
            text-align: center;
            margin-bottom: 14px;
            font-size: 1.05rem;
            letter-spacing: -0.025em;
        }
        .summary-card .karat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            border-radius: 10px;
            margin: 6px 0;
            font-weight: 700;
        }
        .summary-card .karat-row-24 { background: #f0f9ff; color: #0369a1; border: 1px solid #e0f2fe; }
        .summary-card .karat-row-21 { background: #fffbeb; color: #b45309; border: 1px solid #fef3c7; }
        .summary-card .karat-label {
            font-size: 0.85rem;
            font-weight: 700;
        }
        .summary-card .karat-value {
            font-weight: 800;
            font-size: 0.95rem;
        }
        .remain-badge {
            font-size: 11px;
            color: #64748b;
            display: block;
            margin-top: 3px;
            font-weight: 600;
        }
        .fullscreen-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f8fafc;
            z-index: 1000;
            overflow-y: auto;
            padding: 32px;
        }
        .fullscreen-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px 32px;
            border-radius: 18px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            margin-bottom: 28px;
            border: 1px solid #e2e8f0;
        }
        .center-card {
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
        }

        /* تنسيق أزرار اتجاه الطباعة */
        .orientation-btn {
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .orientation-btn.active {
            border-color: #2563eb;
            background-color: #eff6ff;
            color: #1e40af;
        }

        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .summary-card, .karat-row, .stage-btn { break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ========== Firebase Config ==========
        const firebaseConfig = {
            apiKey: "AIzaSyDPtAOvUDDctciRPrAgUPSTzDR1iA_BCbI",
            authDomain: "gbi-production.firebaseapp.com",
            projectId: "gbi-production",
            storageBucket: "gbi-production.firebasestorage.app",
            messagingSenderId: "574329503287",
            appId: "1:574329503287:web:ccf6cfba39ef2e1e0d49b2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const { useState, useEffect, useMemo } = React;

        // CSS المشترك لطباعة التقرير كـ PDF مع إمكانية تحديد الاتجاه (portrait أو landscape)
        const getPrintCSS = (orientation = 'portrait') => `
            @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
            @page {
                size: A4 ${orientation};
                margin: 12mm;
            }
            * {
                box-sizing: border-box;
                font-family: 'Cairo', sans-serif;
            }
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                direction: rtl;
                background: #fff;
                color: #0f172a;
                padding: 20px;
            }
            .page-container {
                border: 3px double #1e293b;
                border-radius: 8px;
                padding: 20px;
                min-height: 98vh;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                box-sizing: border-box;
            }
            .content-wrap {
                flex: 1;
            }
            h1 {
                text-align: center;
                font-size: 24px;
                color: #0f172a;
                margin: 0 0 5px 0;
                font-weight: 800;
            }
            .sub {
                text-align: center;
                color: #475569;
                font-size: 13px;
                margin-bottom: 15px;
                font-weight: 600;
            }
            .print-date {
                text-align: center;
                color: #334155;
                font-size: 12px;
                margin-bottom: 20px;
                background: #f1f5f9;
                padding: 6px;
                border-radius: 6px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 10px;
                font-size: 13px;
            }
            th, td {
                border: 1px solid #cbd5e1;
                padding: 8px 10px;
                text-align: center;
            }
            th {
                background: #1e293b;
                color: #ffffff;
                font-weight: 700;
            }
            tr:nth-child(even) {
                background: #f8fafc;
            }
            .totals {
                margin-top: 20px;
                padding: 12px;
                background: #f1f5f9;
                border-radius: 8px;
                display: flex;
                gap: 30px;
                justify-content: center;
                border: 1px solid #cbd5e1;
                font-weight: 700;
            }
            .print-footer {
                margin-top: 30px;
                padding-top: 12px;
                border-top: 2px solid #1e293b;
                text-align: center;
                font-size: 13px;
                color: #0f172a;
                font-weight: 700;
                line-height: 1.6;
            }
            .print-footer p {
                margin: 2px 0;
            }
            @media print {
                body { padding: 0; }
                .page-container { border: 3px double #1e293b !important; }
                th { background: #1e293b !important; color: #fff !important; -webkit-print-color-adjust: exact; }
                tr:nth-child(even) { background: #f8fafc !important; -webkit-print-color-adjust: exact; }
                .totals { background: #f1f5f9 !important; -webkit-print-color-adjust: exact; }
            }
        `;

        // ========== التطبيق الرئيسي ==========
        function FactoryApp() {
            // --- حالة الدخول ---
            const [user, setUser] = useState({ loggedIn: false, role: '', name: '' });
            const [username, setUsername] = useState('ADMIN');
            const [password, setPassword] = useState('');

            // --- بيانات الإنتاج ---
            const [dataList, setDataList] = useState([]);
            const [loading, setLoading] = useState(true);

            // --- نموذج التشغيل ---
            const [newItem, setNewItem] = useState({
                item: 'توله',
                karat: '24',
                unitWeight: '31.10',
                count: ''
            });

            // --- فلاتر التاريخ للإنتاج ---
            const [filterFrom, setFilterFrom] = useState('');
            const [filterTo, setFilterTo] = useState('');

            // --- نوافذ منبثقة ---
            const [editModal, setEditModal] = useState({ isOpen: false, record: null });
            const [moveModal, setMoveModal] = useState({
                isOpen: false,
                docId: null,
                targetField: '',
                targetLabel: '',
                sourceField: '',
                sourceLabel: '',
                maxMove: 0,
                currentTarget: 0,
                unitWeight: 1,
                available: 0
            });
            const [reportModal, setReportModal] = useState({ isOpen: false, title: '', data: [], type: '' });
            const [inventoryModal, setInventoryModal] = useState(false);
            const [inventoryDetailPage, setInventoryDetailPage] = useState(false);

            // --- حالة اتجاه الطباعة (جديد) ---
            const [printOrientation, setPrintOrientation] = useState('portrait');

            // --- بيانات الجرد ---
            const [inventoryList, setInventoryList] = useState([]);
            const [inventoryForm, setInventoryForm] = useState({
                id: null,
                item: '',
                karat: '24',
                weight: ''
            });
            const [isEditingInventory, setIsEditingInventory] = useState(false);
            const [invFilterFrom, setInvFilterFrom] = useState('');
            const [invFilterTo, setInvFilterTo] = useState('');

            // ========== جلب البيانات ==========
            useEffect(() => {
                if (!user.loggedIn) return;

                const unsubProd = db.collection('production_data')
                    .orderBy('id', 'desc')
                    .onSnapshot((snap) => {
                        const items = [];
                        snap.forEach(d => items.push({ docId: d.id, ...d.data() }));
                        setDataList(items);
                        setLoading(false);
                    }, err => {
                        console.error(err);
                        setLoading(false);
                    });

                const unsubInv = db.collection('inventory_data')
                    .orderBy('id', 'desc')
                    .onSnapshot((snap) => {
                        const inv = [];
                        snap.forEach(d => inv.push({ docId: d.id, ...d.data() }));
                        setInventoryList(inv);
                    });

                return () => {
                    unsubProd();
                    unsubInv();
                };
            }, [user.loggedIn]);

            // ========== دوال مساعدة ==========
            const calcTotalWeight = (unit, cnt) => (parseFloat(unit) || 0) * (parseInt(cnt) || 0);

            const getStatus = (row) => {
                const total = row.count || 0;
                const opBroken = row.operationalBrokenCount || 0;
                const hallmark = row.hallmarkCount || 0;
                const packaging = row.packagingCount || 0;
                const broken = row.brokenCount || 0;
                const barcode = row.barcodeCount || 0;

                const netCount = total - opBroken - broken;

                if (opBroken > 0 && total === opBroken) return 'كسر تشغيل كامل 🔧';
                if ((barcode >= netCount && netCount > 0) || barcode >= total) return 'تم الإنتاج ✅';
                if (barcode > 0) return 'باركود 🔵';
                if (packaging >= hallmark && hallmark > 0) return 'تم التغليف 📦';
                if (packaging > 0) return 'تغليف 🟣';
                if (hallmark >= total) return 'تم الدمغة 🏷️';
                if (hallmark > 0) return 'دمغة 🟡';
                if (opBroken > 0) return 'كسر تشغيل 🔧';
                return 'تشغيل فقط ⚪';
            };

            // ========== عمليات Firebase ==========
            const addProductionRecord = async (record) => {
                try { await db.collection('production_data').add(record); } catch (e) { alert('فشل الحفظ: ' + e.message); }
            };

            const updateProductionRecord = async (docId, updates) => {
                try { await db.collection('production_data').doc(docId).update(updates); } catch (e) { alert('فشل التحديث: ' + e.message); }
            };

            const deleteProductionRecord = async (docId) => {
                if (!confirm('هل أنت متأكد من حذف هذا السجل نهائياً؟')) return;
                try { await db.collection('production_data').doc(docId).delete(); } catch (e) { alert('فشل الحذف: ' + e.message); }
            };

            // عمليات الجرد
            const addInventoryRecord = async (data) => {
                try {
                    await db.collection('inventory_data').add({
                        id: Date.now(),
                        date: new Date().toLocaleString('ar-EG'),
                        ...data
                    });
                } catch (e) { alert('فشل حفظ الجرد: ' + e.message); }
            };

            const updateInventoryRecord = async (docId, data) => {
                try {
                    await db.collection('inventory_data').doc(docId).update(data);
                } catch (e) { alert('فشل تحديث الجرد: ' + e.message); }
            };

            const deleteInventoryRecord = async (docId) => {
                if (!confirm('هل أنت متأكد من حذف هذا الجرد نهائياً؟')) return;
                try { await db.collection('inventory_data').doc(docId).delete(); } catch (e) { alert('فشل حذف الجرد: ' + e.message); }
            };

            // ========== معالجات الأحداث ==========
            const handleLogin = (e) => {
                e.preventDefault();
                if (password === '1234') {
                    setUser({
                        loggedIn: true,
                        role: username === 'ADMIN' ? 'admin' : 'viewer',
                        name: username
                    });
                } else {
                    alert('كلمة المرور الصحيحة هي: 1234');
                }
            };

            const handleItemChange = (val) => {
                const karat = val === 'توله' ? '24' : '21';
                let weight = '31.10';
                if (val === 'جنيه') weight = '8';
                else if (val === 'نصف جنيه') weight = '4';
                else if (val === 'ربع جنيه') weight = '2';
                setNewItem({ ...newItem, item: val, karat, unitWeight: weight });
            };

            const handleAddItem = async (e) => {
                e.preventDefault();
                const cnt = parseInt(newItem.count) || 0;
                if (cnt <= 0) { alert('أدخل عدداً صحيحاً أكبر من صفر'); return; }
                const now = new Date();
                const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

                const record = {
                    id: Date.now(),
                    date: dateStr,
                    item: newItem.item,
                    karat: newItem.karat,
                    unitWeight: parseFloat(newItem.unitWeight) || 0,
                    count: cnt,
                    totalWeight: calcTotalWeight(newItem.unitWeight, cnt),
                    operationalBrokenCount: 0,
                    hallmarkCount: 0,
                    packagingCount: 0,
                    brokenCount: 0,
                    barcodeCount: 0,
                };
                await addProductionRecord(record);
                setNewItem({ item: 'توله', karat: '24', unitWeight: '31.10', count: '' });
            };

            const openEditModal = (record) => {
                setEditModal({ isOpen: true, record: { ...record } });
            };

            const handleEditSave = async () => {
                const rec = editModal.record;
                if (!rec) return;
                const cnt = parseInt(rec.count) || 0;
                if (cnt <= 0) { alert('العدد الكلي يجب أن يكون أكبر من صفر'); return; }

                const opBroken = parseInt(rec.operationalBrokenCount) || 0;
                const hallmark = parseInt(rec.hallmarkCount) || 0;
                const packaging = parseInt(rec.packagingCount) || 0;
                const broken = parseInt(rec.brokenCount) || 0;
                const barcode = parseInt(rec.barcodeCount) || 0;

                if (opBroken + hallmark + packaging + broken + barcode > cnt) {
                    alert('مجموع جميع المراحل لا يمكن أن يتجاوز العدد الكلي');
                    return;
                }

                const updates = {
                    item: rec.item,
                    karat: rec.karat,
                    unitWeight: parseFloat(rec.unitWeight) || 0,
                    count: cnt,
                    totalWeight: calcTotalWeight(rec.unitWeight, cnt),
                    operationalBrokenCount: opBroken,
                    hallmarkCount: hallmark,
                    packagingCount: packaging,
                    brokenCount: broken,
                    barcodeCount: barcode,
                };
                await updateProductionRecord(rec.docId, updates);
                setEditModal({ isOpen: false, record: null });
            };

            const handleDelete = (docId) => {
                deleteProductionRecord(docId);
            };

            // ========== نظام النقل ==========
            const openMoveModal = (docId, targetField, targetLabel, sourceField, sourceLabel, maxMove, currentTarget, unitWeight, available) => {
                setMoveModal({
                    isOpen: true,
                    docId,
                    targetField,
                    targetLabel,
                    sourceField,
                    sourceLabel,
                    maxMove,
                    currentTarget,
                    unitWeight,
                    available
                });
                setMoveInput('0');
            };

            const [moveInput, setMoveInput] = useState('0');

            const handleMove = async () => {
                const amount = parseInt(moveInput) || 0;
                if (amount <= 0) { alert('أدخل عدداً صحيحاً أكبر من صفر'); return; }
                if (amount > moveModal.maxMove) {
                    alert(`الحد الأقصى المسموح للنقل هو ${moveModal.maxMove}`);
                    return;
                }

                const updates = {};
                const newTarget = (moveModal.currentTarget || 0) + amount;
                const newSource = (moveModal.available || 0) - amount;

                updates[moveModal.targetField] = newTarget;
                updates[moveModal.sourceField] = newSource;

                await updateProductionRecord(moveModal.docId, updates);
                setMoveModal({ isOpen: false, docId: null, targetField: '', targetLabel: '', sourceField: '', sourceLabel: '', maxMove: 0, currentTarget: 0, unitWeight: 1, available: 0 });
            };

            // ========== فلتر البيانات ==========
            const filteredData = useMemo(() => {
                let list = dataList;
                if (filterFrom) {
                    const from = new Date(filterFrom);
                    list = list.filter(r => new Date(r.date) >= from);
                }
                if (filterTo) {
                    const to = new Date(filterTo);
                    to.setHours(23, 59, 59);
                    list = list.filter(r => new Date(r.date) <= to);
                }
                return list;
            }, [dataList, filterFrom, filterTo]);

            // ========== إحصائيات البوكسات ==========
            const stats = useMemo(() => {
                const init = () => ({ operation: 0, opBroken: 0, hallmark: 0, packaging: 0, broken: 0, barcode: 0 });
                const stats24 = init();
                const stats21 = init();

                filteredData.forEach(r => {
                    const unit = parseFloat(r.unitWeight) || 0;
                    const total = parseInt(r.count) || 0;
                    const opBroken = parseInt(r.operationalBrokenCount) || 0;
                    const hallmark = parseInt(r.hallmarkCount) || 0;
                    const packaging = parseInt(r.packagingCount) || 0;
                    const broken = parseInt(r.brokenCount) || 0;
                    const barcode = parseInt(r.barcodeCount) || 0;

                    const available = total - opBroken - hallmark - packaging - broken - barcode;
                    const is24 = String(r.karat) === '24';
                    const targetStats = is24 ? stats24 : stats21;

                    if (available > 0) targetStats.operation += available * unit;
                    if (opBroken > 0) targetStats.opBroken += opBroken * unit;
                    if (hallmark > 0) targetStats.hallmark += hallmark * unit;
                    if (packaging > 0) targetStats.packaging += packaging * unit;
                    if (broken > 0) targetStats.broken += broken * unit;
                    if (barcode > 0) targetStats.barcode += barcode * unit;
                });

                return { stats24, stats21 };
            }, [filteredData]);

            // ========== فلتر الجرد ==========
            const filteredInventory = useMemo(() => {
                let list = inventoryList;
                if (invFilterFrom) {
                    const from = new Date(invFilterFrom);
                    list = list.filter(r => new Date(r.date) >= from);
                }
                if (invFilterTo) {
                    const to = new Date(invFilterTo);
                    to.setHours(23, 59, 59);
                    list = list.filter(r => new Date(r.date) <= to);
                }
                return list;
            }, [inventoryList, invFilterFrom, invFilterTo]);

            const inventoryStats = useMemo(() => {
                let totalWeight24 = 0;
                let totalWeight21 = 0;
                filteredInventory.forEach(r => {
                    let w = parseFloat(r.totalWeight);
                    if (isNaN(w) || w === 0) {
                        w = (parseFloat(r.unitWeight) || 0) * (parseInt(r.count) || 0);
                    }
                    if (String(r.karat) === '24') totalWeight24 += w;
                    else if (String(r.karat) === '21') totalWeight21 += w;
                });
                return { totalWeight24, totalWeight21 };
            }, [filteredInventory]);

            // ========== تقارير المراحل ==========
            const openDetails = (type, title) => {
                let data = [];
                switch (type) {
                    case 'operation':
                        data = filteredData.filter(r => {
                            const total = r.count || 0;
                            const opBroken = r.operationalBrokenCount || 0;
                            const hallmark = r.hallmarkCount || 0;
                            const packaging = r.packagingCount || 0;
                            const broken = r.brokenCount || 0;
                            const barcode = r.barcodeCount || 0;
                            return (total - opBroken - hallmark - packaging - broken - barcode) > 0;
                        });
                        break;
                    case 'operationalBroken':
                        data = filteredData.filter(r => (r.operationalBrokenCount || 0) > 0);
                        break;
                    case 'hallmark':
                        data = filteredData.filter(r => (r.hallmarkCount || 0) > 0);
                        break;
                    case 'packaging':
                        data = filteredData.filter(r => (r.packagingCount || 0) > 0);
                        break;
                    case 'broken':
                        data = filteredData.filter(r => (r.brokenCount || 0) > 0);
                        break;
                    case 'barcode':
                        data = filteredData.filter(r => (r.barcodeCount || 0) > 0);
                        break;
                    default:
                        data = filteredData;
                }
                setReportModal({ isOpen: true, title, data, type });
            };

            // ========== الجرد المتقدم ==========
            const openInventoryFullscreen = () => {
                setInventoryModal(true);
                resetInventoryForm();
            };

            const resetInventoryForm = () => {
                setInventoryForm({
                    id: null,
                    item: '',
                    karat: '24',
                    weight: ''
                });
                setIsEditingInventory(false);
            };

            const handleInventoryItemChange = (val) => {
                setInventoryForm({ ...inventoryForm, item: val });
            };

            const handleInventorySubmit = async (e) => {
                e.preventDefault();
                const w = parseFloat(inventoryForm.weight);
                if (isNaN(w) || w <= 0) { alert('الرجاء إدخال وزن صحيح أكبر من صفر'); return; }
                if (!inventoryForm.item.trim()) { alert('الرجاء كتابة اسم الصنف'); return; }

                const data = {
                    item: inventoryForm.item.trim(),
                    karat: inventoryForm.karat,

                                        </div>

                                            <label className="block text-xs font-bold text-slate-600 mb-1.5">العدد الكلي</label>
                                            <input type="number" min="1" value={editModal.record.count} onChange={e => setEditModal({ ...editModal, record: { ...editModal.record, count: e.target.value } })}
                                                className="w-full p-3 border border-slate-300 rounded-2xl font-bold text-center shadow-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-orange-700 mb-1.5">كسر تشغيل</label>
                                            <input type="number" min="0" value={editModal.record.operationalBrokenCount || 0} onChange={e => setEditModal({ ...editModal, record: { ...editModal.record, operationalBrokenCount: e.target.value } })}
                                                className="w-full p-3 border border-slate-300 rounded-2xl font-bold text-center shadow-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-blue-700 mb-1.5">الدمغة</label>
                                            <input type="number" min="0" value={editModal.record.hallmarkCount || 0} onChange={e => setEditModal({ ...editModal, record: { ...editModal.record, hallmarkCount: e.target.value } })}
                                                className="w-full p-3 border border-slate-300 rounded-2xl font-bold text-center shadow-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-emerald-700 mb-1.5">التغليف</label>
                                            <input type="number" min="0" value={editModal.record.packagingCount || 0} onChange={e => setEditModal({ ...editModal, record: { ...editModal.record, packagingCount: e.target.value } })}
                                                className="w-full p-3 border border-slate-300 rounded-2xl font-bold text-center shadow-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-red-700 mb-1.5">كسر دمغة</label>
                                            <input type="number" min="0" value={editModal.record.brokenCount || 0} onChange={e => setEditModal({ ...editModal, record: { ...editModal.record, brokenCount: e.target.value } })}
                                                className="w-full p-3 border border-slate-300 rounded-2xl font-bold text-center shadow-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-purple-700 mb-1.5">الباركود</label>
                                            <input type="number" min="0" value={editModal.record.barcodeCount || 0} onChange={e => setEditModal({ ...editModal, record: { ...editModal.record, barcodeCount: e.target.value } })}
                                                className="w-full p-3 border border-slate-300 rounded-2xl font-bold text-center shadow-sm" />
                                        </div>
                                        <div className="col-span-2 text-xs text-slate-500 font-bold bg-slate-50 p-3.5 rounded-2xl border">
                                            ⚡ تأكد أن مجموع (كسر تشغيل + دمغة + تغليف + كسر دمغة + باركود) ≤ العدد الكلي
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-3 mt-6 border-t pt-4">
                                        <button onClick={() => setEditModal({ isOpen: false, record: null })}
                                            className="bg-slate-100 hover:bg-slate-200 px-5 py-2.5 rounded-2xl font-bold text-sm text-slate-700">إلغاء</button>
                                        <button onClick={handleEditSave}
                                            className="bg-blue-700 hover:bg-blue-800 text-white px-6 py-2.5 rounded-2xl font-bold text-sm shadow-md">حفظ التغييرات</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* نافذة تقارير التفاصيل عند الضغط على البوكسات */}
                        {reportModal.isOpen && (
                            <div className="fixed inset-0 modal-overlay flex justify-center items-center p-4 z-50 no-print">
                                <div className="bg-white rounded-3xl shadow-2xl w-full max-w-5xl max-h-[85vh] overflow-hidden flex flex-col border border-slate-100">
                                    <div className="p-6 border-b border-slate-200 flex justify-between items-center bg-slate-50/80">
                                        <div className="flex items-center gap-3">
                                            <h3 className="font-extrabold text-2xl text-slate-800">{reportModal.title}</h3>
                                            {user.role === 'admin' && (
                                                <button onClick={() => executeReportPrint(reportModal.title, reportModal.data, reportModal.type)}
                                                    className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-sm transition">
                                                    🖨️ طباعة / PDF
                                                </button>
                                            )}
                                        </div>
                                        <button onClick={() => setReportModal({ isOpen: false, title: '', data: [], type: '' })}
                                            className="text-slate-400 hover:text-slate-600 bg-slate-200 hover:bg-slate-300 w-10 h-10 rounded-full flex justify-center items-center text-lg font-bold">✕</button>
                                    </div>
                                    <div className="p-6 overflow-y-auto">
                                        {reportModal.data.length === 0 ? (
                                            <p className="text-center text-slate-400 py-10 font-bold">لا توجد حركات مسجلة لهذا القسم</p>
                                        ) : (
                                            <table className="w-full text-center border-collapse text-sm">
                                                <thead className="bg-slate-900 text-white font-bold">
                                                    <tr>
                                                        <th className="p-3.5">م</th>
                                                        <th className="p-3.5">التاريخ</th>
                                                        <th className="p-3.5">الصنف</th>
                                                        <th className="p-3.5">العيار</th>
                                                        {reportModal.type === 'operation' && (<><th className="p-3.5">العدد المتاح</th><th className="p-3.5">الوزن المتاح</th></>)}
                                                        {reportModal.type === 'operationalBroken' && (<><th className="p-3.5">كسر تشغيل</th><th className="p-3.5">الوزن</th></>)}
                                                        {reportModal.type === 'hallmark' && (<><th className="p-3.5">الدمغة</th><th className="p-3.5">الوزن</th></>)}
                                                        {reportModal.type === 'packaging' && (<><th className="p-3.5">التغليف</th><th className="p-3.5">الوزن</th></>)}
                                                        {reportModal.type === 'broken' && (<><th className="p-3.5">كسر دمغة</th><th className="p-3.5">الوزن</th></>)}
                                                        {reportModal.type === 'barcode' && (<><th className="p-3.5">الباركود</th><th className="p-3.5">الوزن</th></>)}
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-200 font-semibold">
                                                    {reportModal.data.map((r, i) => {
                                                        const total = r.count || 0;
                                                        const opBroken = r.operationalBrokenCount || 0;
                                                        const hallmark = r.hallmarkCount || 0;
                                                        const packaging = r.packagingCount || 0;
                                                        const broken = r.brokenCount || 0;
                                                        const barcode = r.barcodeCount || 0;
                                                        const available = total - opBroken - hallmark - packaging - broken - barcode;
                                                        return (
                                                            <tr key={i} className="hover:bg-slate-50">
                                                                <td className="p-3.5">{i+1}</td>
                                                                <td className="p-3.5 text-slate-500 font-mono text-xs">{r.date}</td>
                                                                <td className="p-3.5 font-bold">{r.item} {r.unitWeight} ج</td>
                                                                <td className="p-3.5">عيار {r.karat}</td>
                                                                {reportModal.type === 'operation' && (<><td className="p-3.5 font-bold">{available}</td><td className="p-3.5 font-bold">{(available * r.unitWeight).toFixed(2)}ج</td></>)}
                                                                {reportModal.type === 'operationalBroken' && (<><td className="p-3.5 font-bold text-orange-700">{opBroken}</td><td className="p-3.5 font-bold text-orange-700">{(opBroken * r.unitWeight).toFixed(2)}ج</td></>)}
                                                                {reportModal.type === 'hallmark' && (<><td className="p-3.5 font-bold text-blue-700">{hallmark}</td><td className="p-3.5 font-bold text-blue-700">{(hallmark * r.unitWeight).toFixed(2)}ج</td></>)}
                                                                {reportModal.type === 'packaging' && (<><td className="p-3.5 font-bold text-emerald-700">{packaging}</td><td className="p-3.5 font-bold text-emerald-700">{(packaging * r.unitWeight).toFixed(2)}ج</td></>)}
                                                                {reportModal.type === 'broken' && (<><td className="p-3.5 font-bold text-red-700">{broken}</td><td className="p-3.5 font-bold text-red-700">{(broken * r.unitWeight).toFixed(2)}ج</td></>)}
                                                                {reportModal.type === 'barcode' && (<><td className="p-3.5 font-bold text-purple-700">{barcode}</td><td className="p-3.5 font-bold text-purple-700">{(barcode * r.unitWeight).toFixed(2)}ج</td></>)}
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========== نافذة الجرد ========== */}
                        {inventoryModal && (
                            <div className="fullscreen-modal no-print">
                                <div className="modal-header">
                                    <h2 className="text-2xl font-extrabold text-slate-800">📋 تقرير الجرد </h2>
                                    <div className="flex gap-2">
                                        <button onClick={() => { setInventoryModal(false); resetInventoryForm(); }}
                                            className="text-slate-400 hover:text-slate-600 bg-slate-200 hover:bg-slate-300 w-10 h-10 rounded-full flex justify-center items-center text-xl font-bold">✕</button>
                                    </div>
                                </div>

                                <div onClick={openInventoryDetailPage} className="summary-card border-amber center-card">
                                    <div className="card-title">إجمالي الجرد حسب العيار</div>
                                    <div className="karat-row karat-row-24">
                                        <span className="karat-label">عيار 24</span>
                                        <span className="karat-value">{inventoryStats.totalWeight24.toFixed(2)} ج</span>
                                    </div>
                                    <div className="karat-row karat-row-21">
                                        <span className="karat-label">عيار 21</span>
                                        <span className="karat-value">{inventoryStats.totalWeight21.toFixed(2)} ج</span>
                                    </div>
                                    <div className="mt-2 text-xs text-slate-400 font-bold text-center">اضغط لعرض التفاصيل الكاملة والطباعة</div>
                                </div>

                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-8 flex flex-wrap items-end gap-4 mt-6">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5">من تاريخ</label>
                                        <input type="date" value={invFilterFrom} onChange={e => setInvFilterFrom(e.target.value)}
                                            className="p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:border-blue-600 text-sm font-semibold shadow-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5">إلى تاريخ</label>
                                        <input type="date" value={invFilterTo} onChange={e => setInvFilterTo(e.target.value)}
                                            className="p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:border-blue-600 text-sm font-semibold shadow-sm" />
                                    </div>
                                    <button onClick={() => { setInvFilterFrom(''); setInvFilterTo(''); }}
                                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-bold border border-slate-300">
                                        إلغاء الفلتر
                                    </button>
                                </div>

                                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 mb-8">
                                    <h3 className="text-xl font-extrabold text-slate-800 mb-6 border-b pb-4">
                                        {isEditingInventory ? 'تعديل سجل جرد' : 'إضافة سجل جرد جديد'}
                                    </h3>
                                    <form onSubmit={handleInventorySubmit} className="grid grid-cols-1 md:grid-cols-4 gap-5 items-end">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1.5">الصنف</label>
                                            <input type="text" value={inventoryForm.item} onChange={e => handleInventoryItemChange(e.target.value)}
                                                placeholder="اكتب اسم الصنف"
                                                className="w-full p-3 border border-slate-300 rounded-2xl focus:outline-none focus:border-blue-600 font-bold text-center shadow-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1.5">العيار</label>
                                            <select value={inventoryForm.karat} onChange={e => setInventoryForm({ ...inventoryForm, karat: e.target.value })}
                                                className="w-full p-3 border border-slate-300 rounded-2xl focus:outline-none focus:border-blue-600 font-bold shadow-sm">
                                                <option value="24">24</option>
                                                <option value="21">21</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1.5">الوزن (ج)</label>
                                            <input type="number" step="0.01" min="0.01" value={inventoryForm.weight} onChange={e => setInventoryForm({ ...inventoryForm, weight: e.target.value })}
                                                placeholder="أدخل الوزن الإجمالي"
                                                className="w-full p-3 border border-slate-300 rounded-2xl focus:outline-none focus:border-blue-600 text-center font-bold shadow-sm" />
                                        </div>
                                        <div>
                                            <button type="submit"
                                                className="bg-slate-900 hover:bg-slate-800 text-white font-bold p-3.5 rounded-2xl shadow-md w-full text-base">
                                                {isEditingInventory ? 'تحديث السجل' : 'حفظ الجرد'}
                                            </button>
                                        </div>
                                    </form>
                                    {isEditingInventory && (
                                        <div className="mt-4 text-right">
                                            <button onClick={resetInventoryForm} className="text-xs text-slate-500 hover:text-slate-800 underline font-bold">
                                                إلغاء التعديل
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-white rounded-3xl shadow-sm overflow-hidden border border-slate-200">
                                    <div className="p-5 border-b border-slate-200 bg-slate-50/80">
                                        <h3 className="text-xl font-extrabold text-slate-800">سجل الجرد</h3>
                                    </div>
                                    <div className="overflow-x-auto">
                                        {filteredInventory.length === 0 ? (
                                            <p className="text-center text-slate-400 py-10 font-bold">لا توجد جردات مسجلة</p>
                                        ) : (
                                            <table className="w-full text-center border-collapse text-sm">
                                                <thead className="bg-slate-900 text-white font-bold">
                                                    <tr>
                                                        <th className="p-3.5">التاريخ</th>
                                                        <th className="p-3.5">الصنف</th>
                                                        <th className="p-3.5">العيار</th>
                                                        <th className="p-3.5">الوزن (ج)</th>
                                                        <th className="p-3.5 no-print">إجراءات</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-200 font-semibold">
                                                    {filteredInventory.map((inv) => {
                                                        let w = parseFloat(inv.totalWeight);
                                                        if (isNaN(w) || w === 0) {
                                                            w = (parseFloat(inv.unitWeight) || 0) * (parseInt(inv.count) || 0);
                                                        }
                                                        return (
                                                            <tr key={inv.docId} className="hover:bg-slate-50">
                                                                <td className="p-3.5 text-slate-500 font-mono text-xs">{inv.date}</td>
                                                                <td className="p-3.5 font-bold">{inv.item}</td>
                                                                <td className="p-3.5">
                                                                    <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${inv.karat === '24' ? 'bg-amber-100 text-amber-900' : 'bg-yellow-100 text-yellow-900'}`}>
                                                                        عيار {inv.karat}
                                                                    </span>
                                                                </td>
                                                                <td className="p-3.5 font-extrabold text-purple-900">{w.toFixed(2)} ج</td>
                                                                <td className="p-3.5 no-print">
                                                                    <div className="flex justify-center gap-2">
                                                                        <button onClick={() => handleEditInventory(inv)} className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm">تعديل</button>
                                                                        <button onClick={() => handleDeleteInventory(inv.docId)} className="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm">حذف</button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========== صفحة تفاصيل الجرد ========== */}
                        {inventoryDetailPage && (
                            <div className="fullscreen-modal no-print">
                                <div className="modal-header">
                                    <h2 className="text-2xl font-extrabold text-slate-800">📊 تفاصيل الجرد حسب العيار</h2>
                                    <div className="flex gap-2">
                                        <button onClick={executeInventoryDetailPrint}
                                            className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-2xl text-sm font-bold shadow-sm transition">
                                            🖨️ طباعة / PDF
                                        </button>
                                        <button onClick={() => setInventoryDetailPage(false)}
                                            className="text-slate-400 hover:text-slate-600 bg-slate-200 hover:bg-slate-300 w-10 h-10 rounded-full flex justify-center items-center text-xl font-bold">✕</button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-8">
                                    <div className="summary-card border-indigo">
                                        <div className="card-title">عيار 24</div>
                                        <div className="karat-row karat-row-24">
                                            <span className="karat-label">الإجمالي</span>
                                            <span className="karat-value">{inventoryStats.totalWeight24.toFixed(2)} ج</span>
                                        </div>
                                    </div>
                                    <div className="summary-card border-amber">
                                        <div className="card-title">عيار 21</div>
                                        <div className="karat-row karat-row-21">
                                            <span className="karat-label">الإجمالي</span>
                                            <span className="karat-value">{inventoryStats.totalWeight21.toFixed(2)} ج</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-3xl shadow-sm overflow-hidden border border-slate-200">
                                    <div className="p-5 border-b border-slate-200 bg-slate-50/80">
                                        <h3 className="text-xl font-extrabold text-slate-800">قائمة الجردات التفصيلية</h3>
                                    </div>
                                    <div className="overflow-x-auto">
                                        {filteredInventory.length === 0 ? (
                                            <p className="text-center text-slate-400 py-10 font-bold">لا توجد جردات مسجلة</p>
                                        ) : (
                                            <table className="w-full text-center border-collapse text-sm">
                                                <thead className="bg-slate-900 text-white font-bold">
                                                    <tr>
                                                        <th className="p-3.5">م</th>
                                                        <th className="p-3.5">التاريخ</th>
                                                        <th className="p-3.5">الصنف</th>
                                                        <th className="p-3.5">العيار</th>
                                                        <th className="p-3.5">الوزن (ج)</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-200 font-semibold">
                                                    {filteredInventory.map((r, i) => {
                                                        let w = parseFloat(r.totalWeight);
                                                        if (isNaN(w) || w === 0) {
                                                            w = (parseFloat(r.unitWeight) || 0) * (parseInt(r.count) || 0);
                                                        }
                                                        return (
                                                            <tr key={i} className="hover:bg-slate-50">
                                                                <td className="p-3.5">{i+1}</td>
                                                                <td className="p-3.5 text-slate-500 font-mono text-xs">{r.date}</td>
                                                                <td className="p-3.5 font-bold">{r.item}</td>
                                                                <td className="p-3.5">
                                                                    <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${r.karat === '24' ? 'bg-amber-100 text-amber-900' : 'bg-yellow-100 text-yellow-900'}`}>
                                                                        عيار {r.karat}
                                                                    </span>
                                                                </td>
                                                                <td className="p-3.5 font-extrabold text-purple-900">{w.toFixed(2)} ج</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* الفوتر */}
                    <footer className="mt-14 py-8 border-t border-slate-200 bg-white rounded-3xl shadow-sm text-center no-print">
                        <p className="text-sm font-extrabold text-slate-800">نظام متابعة الإنتاج</p>
                        <p className="text-xs font-bold text-slate-600 mt-1.5">إعداد وتصميم م/ أحمد مسلم</p>
                        <p className="text-xs font-semibold text-slate-500 mt-1" dir="ltr">Ahmed.Musalam@newegygold.com - 01201816294</p>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FactoryApp />);
    </script>
</body>
</html>
